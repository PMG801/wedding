x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build:
      context: .
      target: app
    command: ["serve"]
    env_file:
      - ${BODA_ENV_FILE:-.env}
    environment:
      # Soft heap target below mem_limit: the GC works harder before the
      # container hits the cgroup limit (see docs/runbook.md).
      GOMEMLIMIT: 512MiB
    mem_limit: 1g
    logging: *json-logging
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    expose:
      - "8080"
    volumes:
      # One single mount for the whole data root: tmp/, originals/ and hidden/
      # must share a filesystem for atomic renames (see docs/architecture.md).
      - event-data:/srv/evento
    healthcheck:
      test: ["CMD", "/usr/local/bin/boda", "check"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  web:
    build:
      context: .
      target: web
    depends_on:
      app:
        condition: service_healthy
    environment:
      BODA_DOMAIN: ${BODA_DOMAIN:-:80}
    mem_limit: 512m
    logging: *json-logging
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      # Caddy's admin API listens on 127.0.0.1:2019 inside the container; a 200
      # from /config/ means the process is up and has loaded its configuration.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    ports:
      - "8081:80"
    volumes:
      # Caddy only sees published media, read-only; hidden/, tmp/ and the
      # database are never mounted here.
      - type: volume
        source: event-data
        target: /media/originals
        read_only: true
        volume:
          subpath: originals
      - type: volume
        source: event-data
        target: /media/derived
        read_only: true
        volume:
          subpath: derived

volumes:
  event-data:
