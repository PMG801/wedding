services:
  app:
    build:
      context: .
      target: app
    command: ["serve"]
    env_file:
      - ${BODA_ENV_FILE:-.env}
    expose:
      - "8080"
    volumes:
      # One single mount for the whole data root: tmp/, originals/ and hidden/
      # must share a filesystem for atomic renames (see docs/architecture.md).
      - event-data:/srv/evento
    healthcheck:
      test: ["CMD", "/usr/local/bin/boda", "check"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  web:
    build:
      context: .
      target: web
    depends_on:
      app:
        condition: service_healthy
    environment:
      BODA_DOMAIN: ${BODA_DOMAIN:-:80}
    ports:
      - "8081:80"
    volumes:
      # Caddy only sees published media, read-only; hidden/, tmp/ and the
      # database are never mounted here.
      - type: volume
        source: event-data
        target: /media/originals
        read_only: true
        volume:
          subpath: originals
      - type: volume
        source: event-data
        target: /media/derived
        read_only: true
        volume:
          subpath: derived

volumes:
  event-data:
