# Production stack for /srv/boda. Images come from GHCR (published by CI on
# pushes to main with the mutable tag "rc"); nothing is built on the server.
name: boda

x-json-logging: &json-logging
  # Docker shares the root disk with the data volume: cap each container's
  # log at 3 x 10 MB.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ghcr.io/pmg801/boda-app:${BODA_TAG:-rc}
    command: ["serve"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Soft heap target below mem_limit (1 GiB); see docs/runbook.md.
      GOMEMLIMIT: 512MiB
    mem_limit: 1g
    logging: *json-logging
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    expose:
      - "8080"
    volumes:
      # Single mount for the whole data root so tmp/ and originals/ share a
      # filesystem. The host directory must be owned by UID 65532.
      - ./data:/srv/evento
    healthcheck:
      test: ["CMD", "/usr/local/bin/boda", "check"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  web:
    image: ghcr.io/pmg801/boda-web:${BODA_TAG:-rc}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      BODA_DOMAIN: ${BODA_DOMAIN:-:80}
    mem_limit: 512m
    logging: *json-logging
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      # Caddy's admin API (127.0.0.1:2019 inside the container) answers 200 on
      # /config/ once the configuration is loaded.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    ports:
      # Plain HTTP stays on loopback by default; Caddy only uses it for the HTTPS
      # redirect. Reach it with: ssh -L 8081:127.0.0.1:8081 ubuntu@<server>
      # Public: BODA_HTTP_BIND=0.0.0.0 and BODA_HTTP_PORT=80 in .env.
      - "${BODA_HTTP_BIND:-127.0.0.1}:${BODA_HTTP_PORT:-8081}:80"
      # HTTPS is loopback-only by default. In production set
      # BODA_HTTPS_BIND=0.0.0.0 and BODA_HTTPS_PORT=443 in .env.
      - "${BODA_HTTPS_BIND:-127.0.0.1}:${BODA_HTTPS_PORT:-8443}:443"
    volumes:
      - ./data/originals:/media/originals:ro
      - ./data/derived:/media/derived:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
