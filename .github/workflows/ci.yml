name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  checks:
    name: Checks and image builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod

      - name: Test backend
        run: go test ./...
        working-directory: backend

      - name: Vet backend
        run: go vet ./...
        working-directory: backend

      - name: Compile backend
        run: CGO_ENABLED=0 go build ./cmd/boda
        working-directory: backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Test frontend
        run: npm test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image for amd64 and arm64 (OCI, no push)
        run: >-
          docker buildx build
          --platform linux/amd64,linux/arm64
          --target app
          --tag boda-app:ci
          --output type=oci,dest=/tmp/boda-app.oci.tar
          .

      - name: Build web image for amd64 and arm64 (OCI, no push)
        run: >-
          docker buildx build
          --platform linux/amd64,linux/arm64
          --target web
          --tag boda-web:ci
          --output type=oci,dest=/tmp/boda-web.oci.tar
          .

  smoke:
    name: End-to-end smoke test
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run smoke test
        run: scripts/smoke.sh
